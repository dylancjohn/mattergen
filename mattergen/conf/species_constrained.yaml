hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: true

# Species vocabulary, D3PM atom-type diffusion with the structured
# (charge-neutral) loss. Ablate its terms via
# lightning_module.diffusion_module.loss_fn.atomic_numbers_loss_partial.{vb_weight,ce_weight}.
defaults:
  - data_module: mp_20_species
  - trainer: default
  - lightning_module: default
  - lightning_module/diffusion_module: neutral_d3pm
  - lightning_module/diffusion_module/model: mattergen_species
  - lightning_module/diffusion_module/corruption: species
  - _self_

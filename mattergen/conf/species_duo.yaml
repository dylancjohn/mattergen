hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: true

# MatterGen with the species (element + oxidation-state) vocabulary and
# unconstrained Duo atom-type diffusion. Same mp-20-os data and species vocab
# as species.yaml; only the atom-type diffusion family differs.
defaults:
  - data_module: mp_20_species
  - trainer: default
  - lightning_module: default
  - lightning_module/diffusion_module: duo
  - lightning_module/diffusion_module/model: mattergen_duo_species
  - lightning_module/diffusion_module/corruption: duo_species
  - _self_

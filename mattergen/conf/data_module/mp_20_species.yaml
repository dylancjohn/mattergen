_target_: mattergen.common.data.species_datamodule.SpeciesDataModule

# Unused by SpeciesDataModule; the corruption config interpolates
# ${data_module.average_density}. mp-20-os has the same density distribution
# as mp-20, so its value is reused.
average_density: 0.05771451654022283  # atoms/Angstrom**3

max_epochs: 900

# Override with the SPECIES_DATA_DIR env var.
data_dir: ${oc.env:SPECIES_DATA_DIR,${oc.env:PROJECT_ROOT}/../datasets/mp-20-os}

num_workers:
  train: 0
  val: 0
  test: 0

batch_size:
  train: ${eval:'(512 // ${trainer.accumulate_grad_batches}) // (${trainer.devices} * ${trainer.num_nodes})'}
  val:   ${eval:'(64 // (${trainer.devices} * ${trainer.num_nodes}))'}
  test:  ${eval:'(64 // (${trainer.devices} * ${trainer.num_nodes}))'}

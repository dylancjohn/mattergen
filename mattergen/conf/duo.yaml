hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: True

# Element vocabulary, unconstrained Duo atom-type diffusion.
defaults:
  - data_module: mp_20_os
  - trainer: default
  - lightning_module: default
  - lightning_module/diffusion_module: duo
  - lightning_module/diffusion_module/model: mattergen_duo
  - lightning_module/diffusion_module/corruption: duo

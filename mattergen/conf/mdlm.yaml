hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: True

# MatterGen with the element-only vocabulary and unconstrained MDLM atom-type
# diffusion, mirroring default.yaml (D3PM) with only the diffusion family swapped.
defaults:
  - data_module: mp_20
  - trainer: default
  - lightning_module: default
  - lightning_module/diffusion_module: mdlm
  - lightning_module/diffusion_module/model: mattergen
  - lightning_module/diffusion_module/corruption: mdlm

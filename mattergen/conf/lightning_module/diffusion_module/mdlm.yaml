_target_: mattergen.diffusion.diffusion_module.DiffusionModule
loss_fn:
  _target_: mattergen.common.loss.MaterialsLoss
  reduce: sum
  include_pos: True
  include_cell: True
  include_atomic_numbers: True
  atomic_numbers_loss_partial:
    _target_: mattergen.diffusion.mdlm.mdlm_loss.mdlm_loss
    _partial_: true
  weights:
    cell: 1.0
    pos: 0.1
    atomic_numbers: 0.01
model: mattergen
corruption: mdlm
pre_corruption_fn:
  _target_: mattergen.property_embeddings.SetEmbeddingType
  p_unconditional: 0.2
  dropout_fields_iid: false
# min_t matches training.sampling_eps in the reference implementation
# (https://github.com/kuleshov-group/mdlm) rather than MatterGen's D3PM default of 1e-5.
# As for every family, the denoiser is conditioned on t, not on the
# reference's sigma = -log(alpha(t)).
timestep_sampler:
  _target_: mattergen.diffusion.timestep_samplers.UniformTimestepSampler
  min_t: 1e-3
  max_t: 1.0

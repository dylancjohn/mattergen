_target_: mattergen.denoiser.GemNetTDenoiser
hidden_dim: 512
# num_atom_types = vocab.num_species; resolved at runtime via the species_vocab_size resolver.
num_atom_types: ${species_vocab_size:}
gemnet:
  _target_: mattergen.common.gemnet.gemnet.GemNetT
  num_targets: 1
  latent_dim: ${eval:'${..hidden_dim} * (1 + len(${..property_embeddings}))'}  # 1 is for time encoding.
  atom_embedding:
    _target_: mattergen.common.gemnet.layers.embedding_block.SpeciesEmbedding
    emb_size: ${...hidden_dim}
    with_mask_type: ${eval:'${...denoise_atom_types} and "${...atom_type_diffusion}" == "mask"'}
  emb_size_atom: ${..hidden_dim}
  emb_size_edge: ${..hidden_dim}
  max_neighbors: 50
  max_cell_images_per_dim: 5
  cutoff: 7.
  num_blocks: 4
  regress_stress: true
  otf_graph: true
  scale_file: ${oc.env:PROJECT_ROOT}/common/gemnet/gemnet-dT.json
denoise_atom_types: true
# Duo is a uniform-state (mask-free) diffusion family: with_mask_type resolves
# to False above, so fc_atom and SpeciesEmbedding have no MASK column --
# num_atom_types (species_vocab_size) is the full and only clean vocabulary.
atom_type_diffusion: uniform
property_embeddings_adapt: {}
property_embeddings: {}
defaults: []

_target_: mattergen.diffusion.diffusion_module.DiffusionModule
loss_fn:
  _target_: mattergen.common.loss.MaterialsLoss
  reduce: sum
  include_pos: True
  include_cell: True
  include_atomic_numbers: True
  atomic_numbers_loss_partial:
    _target_: mattergen.diffusion.duo.neutral_duo_loss.make_neutral_duo_loss
    # Structured (charge-neutral) Duo loss: a rate-KL sum comparing true and
    # model reverse-rate ratios under the forward-likelihood-tilted
    # charge-neutral distribution. Like neutral_mdlm, it has no weight options.
  weights:
    cell: 1.0
    pos: 0.1
    atomic_numbers: 0.01
model: mattergen_duo
corruption: duo
pre_corruption_fn:
  _target_: mattergen.property_embeddings.SetEmbeddingType
  p_unconditional: 0.2
  dropout_fields_iid: false
# min_t matches training.sampling_eps in the reference implementation
# (https://github.com/s-sahoo/duo) rather than MatterGen's D3PM default of 1e-5.
# As for every family, the denoiser is conditioned on t, not on the
# reference's sigma = -log(alpha(t)).
timestep_sampler:
  _target_: mattergen.diffusion.timestep_samplers.UniformTimestepSampler
  min_t: 1e-3
  max_t: 1.0

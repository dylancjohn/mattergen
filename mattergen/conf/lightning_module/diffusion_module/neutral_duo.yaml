_target_: mattergen.diffusion.diffusion_module.DiffusionModule
loss_fn:
  _target_: mattergen.common.loss.MaterialsLoss
  reduce: sum
  include_pos: True
  include_cell: True
  include_atomic_numbers: True
  atomic_numbers_loss_partial:
    _target_: mattergen.diffusion.duo.neutral_duo_loss.make_neutral_duo_loss
    # Structured charge-neutral atom-type objective: a rate-KL sum comparing
    # true vs. model reverse-rate ratios under the forward-likelihood-tilted
    # charge-neutral distribution. No ablation knobs, same as neutral_mdlm.
  weights:
    cell: 1.0
    pos: 0.1
    # Down-weighted from D3PM's default of 1.0: the continuous-time Duo NELBO's
    # rate weighting makes the raw atom-type loss magnitude ~10x D3PM's bounded
    # discrete-time KL, which was starving cell/pos of gradient signal under
    # the shared value-based gradient clip.
    atomic_numbers: 0.1
model: mattergen_duo
corruption: duo
pre_corruption_fn:
  _target_: mattergen.property_embeddings.SetEmbeddingType
  p_unconditional: 0.2
  dropout_fields_iid: false
# Matches the reference implementation's own training-time floor
# (duo/configs/config.yaml: training.sampling_eps=1e-3), rather than
# MatterGen's D3PM-tuned default of 1e-5. Note the denoiser still conditions
# on raw t (NoiseLevelEncoding), not on the reference's sigma = -log(alpha(t));
# this is unchanged, shared MatterGen behaviour, not specific to this family.
timestep_sampler:
  _target_: mattergen.diffusion.timestep_samplers.UniformTimestepSampler
  min_t: 1e-3
  max_t: 1.0

# Duo corruption for the species vocabulary.
#
# num_classes = num_species (NO +1 -- Duo's uniform-state process has no MASK
# category) is resolved at runtime via the species_vocab_size OmegaConf
# resolver (registered in mattergen.common.data.species_resolvers).
_target_: mattergen.diffusion.corruption.multi_corruption.MultiCorruption
sdes:
  pos:
    _target_: mattergen.common.diffusion.corruption.NumAtomsVarianceAdjustedWrappedVESDE
    wrapping_boundary: 1.0
    sigma_max: 5.0
    limit_info_key: num_atoms

  cell:
    _target_: mattergen.common.diffusion.corruption.LatticeVPSDE.from_vpsde_config
    vpsde_config:
      beta_min: 0.1
      beta_max: 20
      limit_density: ${data_module.average_density}
      limit_var_scaling_constant: 0.25

discrete_corruptions:
  atomic_numbers:
    _target_: mattergen.diffusion.corruption.duo_corruption.DuoCorruption
    offset: 1
    num_classes: ${species_vocab_size:}
    schedule:
      _target_: mattergen.diffusion.continuous_time.schedule.LogLinearSchedule
      eps: 1e-3

hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: true

# MatterGen with the species (element + oxidation-state) vocabulary, MDLM
# atom-type diffusion, AND the structured charge-neutral training objective
# (make_neutral_mdlm_loss, injected into MaterialsLoss.atomic_numbers_loss_partial).
# Same mp-20-os data and species vocab as species_mdlm.yaml; only the atom-type
# loss differs (diffusion_module: neutral_mdlm).
defaults:
  - data_module: mp_20_species
  - trainer: default
  - lightning_module: default
  - lightning_module/diffusion_module: neutral_mdlm
  - lightning_module/diffusion_module/model: mattergen_species
  - lightning_module/diffusion_module/corruption: mdlm_species
  - _self_

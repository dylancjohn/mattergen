hydra:
  run:
    dir: ${oc.env:OUTPUT_DIR,outputs/singlerun/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: true

# Species vocabulary, MDLM atom-type diffusion with the structured
# (charge-neutral) loss.
defaults:
  - data_module: mp_20_species
  - trainer: default
  - lightning_module: default
  - lightning_module/diffusion_module: neutral_mdlm
  - lightning_module/diffusion_module/model: mattergen_species
  - lightning_module/diffusion_module/corruption: mdlm_species
  - _self_
